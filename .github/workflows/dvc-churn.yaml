name: churn-imbalanced-dataset
on: [push]
permissions: write-all
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - uses: iterative/setup-cml@v1
        
        

      - name: Prepare Environment
        env:
            # Secret unique qui contient TOUT le JSON d'auth Google Drive
            DVC_GDRIVE_CREDENTIALS_JSON: ${{ secrets.DVC_GDRIVE_CREDENTIALS_JSON }}
            
        run: |
          # Your ML workflow goes here
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          
          # Configuration de DVC avec Google Drive Service Account
          mkdir -p ~/.config/dvc
          echo '${{ secrets.DVC_GDRIVE_CREDENTIALS_JSON }}' > ~/.config/dvc/gdrive-service-account.json
          
          # Configuration du remote DVC pour utiliser le service account
          dvc remote modify --local myremote gdrive_service_account_json_file ~/.config/dvc/gdrive-service-account.json
          dvc remote modify --local myremote gdrive_use_service_account true
          
          # Pull des données DVC
          dvc pull
          
          # Exécution du script ML
          python script.py
          
          # Ajout et push des résultats (si nécessaire)
          dvc add ./data/ ./models/
          dvc push

      - name: Generate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          # Get the report
          echo "## Metrics" > report.md
          # cat metrics.txt >> report.md

          awk 'NR%4{print "    " $0}{print ""}' metrics.txt >> report.md

          echo "## Confusion Matrix" >> report.md
          echo "![](./conf_matrix.png)" >> report.md
          cml comment create report.md
