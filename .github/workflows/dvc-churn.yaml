name: churn-imbalanced-dataset
on: [push]
permissions: write-all
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - uses: iterative/setup-cml@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC with Service Account
        env:
          DVC_GDRIVE_CREDENTIALS_JSON: ${{ secrets.DVC_GDRIVE_CREDENTIALS_JSON }}
        run: |
          # Créer le fichier de credentials
          mkdir -p ~/.config/dvc
          echo '${{ secrets.DVC_GDRIVE_CREDENTIALS_JSON }}' > ~/.config/dvc/gdrive-credentials.json
          
          # Configurer DVC pour utiliser le service account
          dvc remote modify myremote gdrive_use_service_account true
          dvc remote modify myremote gdrive_service_account_json_file ~/.config/dvc/gdrive-credentials.json
          
          # Vérifier la configuration
          echo "=== DVC Configuration ==="
          cat .dvc/config
          echo "=== Remote Configuration ==="
          dvc remote modify myremote --list

      - name: Pull data and run training
        run: |
          dvc pull
          python script.py

      - name: Generate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Metrics" > report.md
          if [ -f "metrics.txt" ]; then
            awk 'NR%4{print "    " $0}{print ""}' metrics.txt >> report.md
          fi
          echo "## Confusion Matrix" >> report.md
          if [ -f "conf_matrix.png" ]; then
            echo "![](./conf_matrix.png)" >> report.md
          fi
          cml comment create report.md